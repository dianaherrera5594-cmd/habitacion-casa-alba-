<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D de la Habitación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js y OrbitControls desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #111827;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: relative;
        }
        .glass-panel {
            background: rgba(20, 24, 32, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
        .btn-control {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-control:hover {
            transform: translateY(-1px);
            background-color: rgba(255, 255, 255, 0.18);
        }
        .btn-control:active {
            transform: translateY(0);
        }
        .btn-active {
            background-color: #d97706 !important;
            color: #ffffff !important;
            border-color: #f59e0b !important;
            box-shadow: 0 0 12px rgba(217, 119, 6, 0.45);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Panel Superior Izquierdo: Título e Instrucciones -->
    <div class="fixed top-4 left-4 z-10 glass-panel rounded-2xl p-4 text-white max-w-xs sm:max-w-sm pointer-events-auto">
        <div class="flex items-center gap-2.5 mb-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
            <h1 class="text-sm sm:text-base font-semibold tracking-tight">Recorrido Virtual 3D · Habitación</h1>
        </div>
        <p class="text-xs text-gray-300 leading-relaxed mb-3">
            Recreación arquitectónica interactiva con mobiliario, texturas cerámicas y techo acanalado.
        </p>
        <div class="grid grid-cols-1 gap-1.5 text-[11px] text-gray-300 bg-black/30 p-2.5 rounded-xl border border-white/5">
            <div class="flex items-center gap-2">
                <span class="text-amber-400 font-bold">🖱️ Clic Izq / Arrastrar:</span>
                <span>Rotar vista 360°</span>
            </div>
            <div class="flex items-center gap-2">
    <!-- Panel Superior Derecho: Opciones de Ambiente, Techo y Color de Pared -->
    <div class="fixed top-4 right-4 z-10 flex flex-col items-end gap-2 pointer-events-auto">
        <div class="flex flex-wrap justify-end gap-2">
            <button id="btn-lighting" class="glass-panel btn-control text-white text-xs font-medium px-3.5 py-2.5 rounded-xl flex items-center justify-center gap-2 border border-white/15">
                <span id="lighting-icon">☀️</span>
                <span id="lighting-text">Luz: Día Cálida</span>
            </button>
            <button id="btn-roof" class="glass-panel btn-control text-white text-xs font-medium px-3.5 py-2.5 rounded-xl flex items-center justify-center gap-2 border border-white/15">
                <span>🏠</span>
                <span id="roof-text">Ocultar Techo</span>
            </button>
        </div>
        <!-- Selector fino del tono de pared para coincidir con la fotografía -->
        <div class="glass-panel rounded-xl px-3 py-2 flex items-center gap-2 text-white text-[11px] border border-white/15">
            <span class="text-gray-300 font-medium">Pared:</span>
            <button data-wall="#E7D3AD" title="Crema Cálido Foto (Exacto)" class="wall-swatch w-5 h-5 rounded-full border-2 border-amber-400 shadow-sm transition-transform hover:scale-110" style="background-color: #E7D3AD;"></button>
            <button data-wall="#DFC89E" title="Crema Vainilla Intenso" class="wall-swatch w-5 h-5 rounded-full border border-white/40 shadow-sm transition-transform hover:scale-110" style="background-color: #DFC89E;"></button>
            <button data-wall="#EFE0C2" title="Crema Claro" class="wall-swatch w-5 h-5 rounded-full border border-white/40 shadow-sm transition-transform hover:scale-110" style="background-color: #EFE0C2;"></button>
            <input type="color" id="wall-color-picker" value="#E7D3AD" title="Personalizar tono de pared" class="w-5 h-5 rounded cursor-pointer bg-transparent border-0 p-0">
        </div>
    </div>

    <!-- Panel Inferior: Vistas Predefinidas de Cámara -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-10 w-[94%] max-w-2xl pointer-events-auto">
        <div class="glass-panel rounded-2xl p-2 flex flex-wrap items-center justify-center gap-1.5 sm:gap-2">
            <button data-preset="general" class="preset-btn btn-control btn-active text-xs font-medium text-gray-200 px-3 py-2 rounded-xl border border-white/10 flex-1 sm:flex-none whitespace-nowrap">
                📷 Vista General
            </button>
            <button data-preset="beds" class="preset-btn btn-control text-xs font-medium text-gray-200 px-3 py-2 rounded-xl border border-white/10 flex-1 sm:flex-none whitespace-nowrap">
                🛏️ Zona de Camas
            </button>
            <button data-preset="dining" class="preset-btn btn-control text-xs font-medium text-gray-200 px-3 py-2 rounded-xl border border-white/10 flex-1 sm:flex-none whitespace-nowrap">
                🍽️ Comedor y Cocina
            </button>
            <button data-preset="top" class="preset-btn btn-control text-xs font-medium text-gray-200 px-3 py-2 rounded-xl border border-white/10 flex-1 sm:flex-none whitespace-nowrap">
                📐 Vista Superior
            </button>
        </div>
    </div>

    <script>
        /**
         * RECREACIÓN 3D DE LA HABITACIÓN
         * Sistema de coordenadas (en metros):
         * X: Ancho de la habitación (-2.35 a +2.35 -> 4.70m total)
         *    - Pared izquierda (TV / Comedor): X = -2.35
         *    - Pared derecha (Cabeceras Cama 2 & 3 + Ventana): X = +2.35
         * Z: Largo de la habitación (-3.30 a +3.30 -> 6.60m total)
         *    - Pared fondo (Cocineta + Aire Acondicionado): Z = -3.30
         *    - Pared frontal (Cabecera Cama 1 + Caja de Baño): Z = +3.30
         * Y: Altura (0.00 suelo hasta 3.25 techo acanalado)
         */

        let scene, camera, renderer, controls;
        let roofGroup, fanBladesGroup;
        let isNightMode = false;
        let isRoofVisible = true;
        let creamWallMat, beamMat;

        // Luces globales para alternar Día / Noche
        let hemiLight, dirLight, ambientLight;
        let sconceLight1, sconceLight2, sconceBulbMat1, sconceBulbMat2, tvScreenMat;
        const keysPressed = {};

        // Transición suave de cámara
        const cameraAnim = {
            active: false,
            startPos: new THREE.Vector3(),
            endPos: new THREE.Vector3(),
            startTarget: new THREE.Vector3(),
            endTarget: new THREE.Vector3(),
            progress: 0
        };

        // Preajustes de cámara basados en los ángulos de las fotos y vistas útiles
        const CAMERA_PRESETS = {
            general: {
                pos: new THREE.Vector3(-1.85, 2.25, 2.55),
                target: new THREE.Vector3(0.35, 0.95, -0.85)
            },
            beds: {
                // Ángulo fiel a la Foto 1
                pos: new THREE.Vector3(-1.35, 1.68, 2.15),
                target: new THREE.Vector3(0.85, 0.85, -0.35)
            },
            dining: {
                // Ángulo fiel a la Foto 2
                pos: new THREE.Vector3(-0.35, 1.72, 2.35),
                target: new THREE.Vector3(-0.65, 1.15, -2.20)
            },
            top: {
                pos: new THREE.Vector3(0.0, 6.8, 0.35),
                target: new THREE.Vector3(0.0, 0.0, 0.0)
            }
        };

        // ==========================================
        // GENERADORES DE TEXTURAS PROCEDURALES
        // ==========================================
        function createTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Color base cerámica beige claro brillante
            ctx.fillStyle = '#e7dfd3';
            ctx.fillRect(0, 0, 512, 512);

            // Vetas sutiles de mármol/cerámica
            for (let i = 0; i < 45; i++) {
                ctx.beginPath();
                ctx.strokeStyle = i % 2 === 0 ? 'rgba(205, 193, 176, 0.25)' : 'rgba(255, 252, 246, 0.35)';
                ctx.lineWidth = 4 + Math.random() * 14;
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(
                    x + (Math.random() - 0.5) * 180, y + (Math.random() - 0.5) * 180,
                    x + (Math.random() - 0.5) * 180, y + (Math.random() - 0.5) * 180,
                    x + (Math.random() - 0.5) * 220, y + (Math.random() - 0.5) * 220
                );
                ctx.stroke();
            }

            // Líneas de fragua / boquilla (cuadrícula 2x2 por textura)
            ctx.strokeStyle = '#b9afa2';
            ctx.lineWidth = 4;
            ctx.strokeRect(2, 2, 252, 252);
            ctx.strokeRect(258, 2, 252, 252);
            ctx.strokeRect(2, 258, 252, 252);
            ctx.strokeRect(258, 258, 252, 252);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(5, 7);
            texture.anisotropy = 8;
            return texture;
        }

        function createWallTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#e5ddd0';
            ctx.fillRect(0, 0, 512, 512);

            // Textura suave
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = 'rgba(210, 198, 182, 0.18)';
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, 20 + Math.random() * 40, 0, Math.PI * 2);
                ctx.fill();
            }

            // Baldosas verticales
            ctx.strokeStyle = '#c2b7a9';
            ctx.lineWidth = 3;
            for (let x = 0; x <= 512; x += 128) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 512);
                ctx.stroke();
            }
            for (let y = 0; y <= 512; y += 170) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(6, 2);
            return texture;
        }

        function createDecorativeBorderTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#dfd3c3';
            ctx.fillRect(0, 0, 512, 64);

            // Cenefa decorativa con círculos terracota y café como en la foto 2
            ctx.fillStyle = '#7c4a32';
            ctx.fillRect(0, 0, 512, 6);
            ctx.fillRect(0, 58, 512, 6);

            for (let x = 32; x < 512; x += 64) {
                ctx.beginPath();
                ctx.arc(x, 32, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#9c5a3c';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x, 32, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#e8d8c4';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x, 32, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#6b3e26';
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.repeat.set(3, 1);
            return texture;
        }

        function createSunsetPaintingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');

            // Cielo atardecer intenso (rojo, naranja, amarillo)
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 230);
            skyGrad.addColorStop(0, '#1f0c14');
            skyGrad.addColorStop(0.35, '#8b1e16');
            skyGrad.addColorStop(0.7, '#e65c19');
            skyGrad.addColorStop(1, '#ffbe3b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 512, 230);

            // Sol poniente
            ctx.beginPath();
            ctx.arc(270, 195, 34, 0, Math.PI * 2);
            ctx.fillStyle = '#fff3b0';
            ctx.fill();

            // Mar oscuro con reflejo naranja
            const seaGrad = ctx.createLinearGradient(0, 230, 0, 384);
            seaGrad.addColorStop(0, '#4a1510');
            seaGrad.addColorStop(0.4, '#240b0b');
            seaGrad.addColorStop(1, '#0e0505');
            ctx.fillStyle = seaGrad;
            ctx.fillRect(0, 230, 512, 154);

            // Reflejos en el agua
            ctx.fillStyle = 'rgba(255, 165, 50, 0.55)';
            for (let y = 235; y < 370; y += 9) {
                const w = 80 - (y - 235) * 0.35 + Math.sin(y) * 18;
                ctx.fillRect(270 - w / 2, y, w, 3);
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createClockTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#faf9f6';
            ctx.beginPath();
            ctx.arc(128, 128, 120, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 10;
            ctx.strokeStyle = '#1f242d';
            ctx.stroke();

            // Marcas horarias
            ctx.fillStyle = '#1f242d';
            for (let i = 0; i < 12; i++) {
                const angle = (i * Math.PI) / 6;
                const x = 128 + Math.cos(angle) * 95;
                const y = 128 + Math.sin(angle) * 95;
                ctx.beginPath();
                ctx.arc(x, y, i % 3 === 0 ? 5 : 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Manecillas
            ctx.lineCap = 'round';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(128, 128);
            ctx.lineTo(95, 85);
            ctx.stroke();

            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(128, 128);
            ctx.lineTo(185, 105);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // INICIALIZACIÓN DE ESCENA Y LUCES
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x181c24);

            camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 60);
            camera.position.copy(CAMERA_PRESETS.general.pos);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.02;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.copy(CAMERA_PRESETS.general.target);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxDistance = 12;
            controls.minDistance = 0.7;
            controls.maxPolarAngle = Math.PI * 0.49;

            // Cancelar animación automática si el usuario mueve manualmente
            controls.addEventListener('start', () => {
                cameraAnim.active = false;
            });

            setupLighting();
            buildArchitecture();
            buildBathroomBox();
            buildKitchenetteAndAC();
            buildWindowAndWallProps();
            buildBedsAndMats();
            buildDiningAndFan();

            setupUIEvents();
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => { keysPressed[e.code] = true; });
            window.addEventListener('keyup', (e) => { keysPressed[e.code] = false; });
        }

        function setupLighting() {
            // Iluminación neutra-cálida balanceada para evitar saturación amarilla del ACESFilmicToneMapping
            ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
            scene.add(ambientLight);

            hemiLight = new THREE.HemisphereLight(0xffffff, 0xf2ece1, 0.62);
            hemiLight.position.set(0, 3.2, 0);
            scene.add(hemiLight);

            // Luz principal suave desde arriba
            dirLight = new THREE.DirectionalLight(0xfffdf9, 0.45);
            dirLight.position.set(1.5, 4.5, 1.2);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 12;
            const d = 4.5;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            // Aplique 1: Sobre la cocineta (pared Z = -3.30)
            sconceLight1 = new THREE.PointLight(0xfff6e8, 0.42, 7.5, 1.35);
            sconceLight1.position.set(-0.35, 2.55, -3.12);
            sconceLight1.castShadow = false;
            scene.add(sconceLight1);

            // Aplique 2: Sobre la ventana (pared X = +2.35)
            sconceLight2 = new THREE.PointLight(0xfff6e8, 0.42, 7.5, 1.35);
            sconceLight2.position.set(2.18, 2.68, 0.65);
            sconceLight2.castShadow = false;
            scene.add(sconceLight2);
        }

        // ==========================================
        // ARQUITECTURA DE LA HABITACIÓN Y TECHO
        // ==========================================
        function buildArchitecture() {
            const roomW = 4.70;
            const roomL = 6.60;
            const wallH = 3.25;

            // Tono crema cálido exacto muestreado de la fotografía (#E7D3AD)
            creamWallMat = new THREE.MeshStandardMaterial({
                color: 0xe7d3ad,
                roughness: 0.90,
                metalness: 0.0
            });

            // 1. Suelo de cerámica beige con fragua
            const floorTex = createTileTexture();
            const floorMat = new THREE.MeshStandardMaterial({
                map: floorTex,
                roughness: 0.25,
                metalness: 0.08
            });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomL), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 2. Paredes perimetrales
            // Pared fondo (Cocineta, Z = -3.30)
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(roomW + 0.2, wallH, 0.15), creamWallMat);
            backWall.position.set(0, wallH / 2, -roomL / 2 - 0.075);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Pared frontal (Cabecera Cama 1 y Baño, Z = +3.30)
            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(roomW + 0.2, wallH, 0.15), creamWallMat);
            frontWall.position.set(0, wallH / 2, roomL / 2 + 0.075);
            frontWall.receiveShadow = true;
            scene.add(frontWall);

            // Pared izquierda (TV / Comedor, X = -2.35)
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, wallH, roomL), creamWallMat);
            leftWall.position.set(-roomW / 2 - 0.075, wallH / 2, 0);
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // Pared derecha (Ventana y Camas 2 y 3, X = +2.35)
            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, wallH, roomL), creamWallMat);
            rightWall.position.set(roomW / 2 + 0.075, wallH / 2, 0);
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Viga superior estructural (mismo acabado pintado crema de la pared)
            beamMat = new THREE.MeshStandardMaterial({ color: 0xe2cca4, roughness: 0.88 });
            const backBeam = new THREE.Mesh(new THREE.BoxGeometry(roomW, 0.22, 0.14), beamMat);
            backBeam.position.set(0, 2.82, -roomL / 2 + 0.05);
            scene.add(backBeam);

            const rightBeam = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.22, roomL), beamMat);
            rightBeam.position.set(roomW / 2 - 0.05, 2.85, 0);
            scene.add(rightBeam);

            // Zócalo / Enchapado de cerámica a media altura en pared izquierda (Foto 2)
            const wallTileTex = createWallTileTexture();
            const wallTileMat = new THREE.MeshStandardMaterial({
                map: wallTileTex,
                roughness: 0.22,
                metalness: 0.06
            });
            const halfTileWall = new THREE.Mesh(new THREE.BoxGeometry(0.02, 1.52, 4.35), wallTileMat);
            halfTileWall.position.set(-roomW / 2 + 0.01, 0.76, -1.12);
            halfTileWall.receiveShadow = true;
            scene.add(halfTileWall);

            // 3. Techo acanalado expuesto (Eternit / fibrocemento blanco) + correas metálicas
            roofGroup = new THREE.Group();
            const roofSheetMat = new THREE.MeshStandardMaterial({
                color: 0xe6e7e9,
                roughness: 0.65,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            // Crear ondas sinusoidales para las láminas acanaladas
            const waveWidth = roomW + 0.1;
            const waveLength = roomL + 0.1;
            const roofGeo = new THREE.PlaneGeometry(waveWidth, waveLength, 96, 12);
            const posAttr = roofGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vz = Math.sin(vx * 34) * 0.032; // Ondulación característica
                posAttr.setZ(i, vz);
            }
            roofGeo.computeVertexNormals();

            const roofMesh = new THREE.Mesh(roofGeo, roofSheetMat);
            roofMesh.rotation.x = Math.PI / 2;
            roofMesh.position.set(0, wallH, 0);
            roofMesh.castShadow = true;
            roofMesh.receiveShadow = true;
            roofGroup.add(roofMesh);

            // Correas horizontales blancas que sostienen el techo (visibles en Foto 2)
            const purlinMat = new THREE.MeshStandardMaterial({ color: 0xf4f5f7, roughness: 0.45 });
            for (let z = -2.6; z <= 2.6; z += 1.3) {
                const purlin = new THREE.Mesh(new THREE.BoxGeometry(roomW, 0.07, 0.05), purlinMat);
                purlin.position.set(0, wallH - 0.055, z);
                purlin.castShadow = true;
                roofGroup.add(purlin);
            }

            scene.add(roofGroup);
        }

        // ==========================================
        // CAJA DE BAÑO EN LA ESQUINA (FOTO 1 Y 2)
        // ==========================================
        function buildBathroomBox() {
            const bathGroup = new THREE.Group();
            // Usa exactamente el mismo material crema marfil de las paredes principales
            const wallMat = creamWallMat;

            // Dimensiones del módulo de baño (esquina frontal izquierda desde vista comedor: X < 0, Z > 0)

        // ==========================================
        // CONSTRUCCIÓN DE CAMAS, TOALLAS Y TAPETES
        // ==========================================
        function createWoodenBed(options) {
            const {
                width = 1.15,
                length = 1.95,
                sheetColor = 0xf4e3b2,
                hasWhiteTopSheet = false,
                pillowColor = 0xf6df9b,
                towelType = 'single' // 'double', 'single', 'folded_amenities'
            } = options;

            const bedGroup = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x24140d, roughness: 0.55 });
            const sheetMat = new THREE.MeshStandardMaterial({ color: sheetColor, roughness: 0.85 });
            const whiteClothMat = new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 0.78 });
            const pillowMat = new THREE.MeshStandardMaterial({ color: pillowColor, roughness: 0.82 });

            const frameH = 0.30;
            const mattressH = 0.20;
            const headboardH = 1.05;

            // Patas (4 esquinas)
            const legGeo = new THREE.BoxGeometry(0.065, frameH + 0.14, 0.065);
            const legPositions = [
                [-width / 2 + 0.035, (frameH + 0.14) / 2, -length / 2 + 0.035],
                [width / 2 - 0.035, (frameH + 0.14) / 2, -length / 2 + 0.035],
                [-width / 2 + 0.035, (frameH + 0.14) / 2, length / 2 - 0.035],
                [width / 2 - 0.035, (frameH + 0.14) / 2, length / 2 - 0.035]
            ];
            legPositions.forEach(p => {
                const leg = new THREE.Mesh(legGeo, woodMat);
                leg.position.set(...p);
                leg.castShadow = true;
                bedGroup.add(leg);
            });

            // Largueros de madera
            const sideRailGeo = new THREE.BoxGeometry(0.04, 0.14, length - 0.06);
            const leftRail = new THREE.Mesh(sideRailGeo, woodMat);
            leftRail.position.set(-width / 2 + 0.03, frameH - 0.02, 0);
            bedGroup.add(leftRail);

            const rightRail = new THREE.Mesh(sideRailGeo, woodMat);
            rightRail.position.set(width / 2 - 0.03, frameH - 0.02, 0);
            bedGroup.add(rightRail);

            const footRail = new THREE.Mesh(new THREE.BoxGeometry(width - 0.04, 0.14, 0.04), woodMat);
            footRail.position.set(0, frameH - 0.02, length / 2 - 0.03);
            bedGroup.add(footRail);

            // Cabecera de listones verticales (en Z = -length/2)
            const hbPostGeo = new THREE.BoxGeometry(0.07, headboardH, 0.07);
            const hbLeft = new THREE.Mesh(hbPostGeo, woodMat);
            hbLeft.position.set(-width / 2 + 0.035, headboardH / 2, -length / 2 + 0.035);
            hbLeft.castShadow = true;
            bedGroup.add(hbLeft);

            const hbRight = new THREE.Mesh(hbPostGeo, woodMat);
            hbRight.position.set(width / 2 - 0.035, headboardH / 2, -length / 2 + 0.035);
            hbRight.castShadow = true;
            bedGroup.add(hbRight);

            // Travesaños superior e inferior de la cabecera
            const hbTopBar = new THREE.Mesh(new THREE.BoxGeometry(width, 0.11, 0.045), woodMat);
            hbTopBar.position.set(0, headboardH - 0.055, -length / 2 + 0.035);
            hbTopBar.castShadow = true;
            bedGroup.add(hbTopBar);

            const hbBotBar = new THREE.Mesh(new THREE.BoxGeometry(width, 0.07, 0.045), woodMat);
            hbBotBar.position.set(0, 0.42, -length / 2 + 0.035);
            bedGroup.add(hbBotBar);

            // Listones verticales de la cabecera
            const numSlats = Math.floor(width / 0.14);
            for (let i = 1; i < numSlats; i++) {
                const sx = -width / 2 + (width / numSlats) * i;
                const slat = new THREE.Mesh(new THREE.BoxGeometry(0.035, headboardH - 0.48, 0.025), woodMat);
                slat.position.set(sx, 0.42 + (headboardH - 0.48) / 2, -length / 2 + 0.035);
                slat.castShadow = true;
                bedGroup.add(slat);
            }

            // Colchón con sábana ajustable
            const mattress = new THREE.Mesh(
                new THREE.BoxGeometry(width - 0.06, mattressH, length - 0.08),
                sheetMat
            );
            mattress.position.set(0, frameH + mattressH / 2 - 0.02, 0.02);
            mattress.castShadow = true;
            mattress.receiveShadow = true;
            bedGroup.add(mattress);

            // Sábana superior blanca doblada (Cama 1 como en Foto 1 y 2)
            if (hasWhiteTopSheet) {
                const topSheet = new THREE.Mesh(
                    new THREE.BoxGeometry(width - 0.045, mattressH * 0.72, length * 0.72),
                    whiteClothMat
                );
                topSheet.position.set(0, frameH + mattressH * 0.65, length * 0.14);
                topSheet.castShadow = true;
                topSheet.receiveShadow = true;
                bedGroup.add(topSheet);

                // Doblez superior
                const fold = new THREE.Mesh(
                    new THREE.BoxGeometry(width - 0.04, 0.025, 0.16),
                    whiteClothMat
                );
                fold.position.set(0, frameH + mattressH + 0.005, -length * 0.16);
                bedGroup.add(fold);
            }

            // Almohada mullida cerca de la cabecera
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.11, 0.36), pillowMat);
            pillow.position.set(0, frameH + mattressH + 0.035, -length / 2 + 0.32);
            pillow.rotation.x = 0.08;
            pillow.castShadow = true;
            bedGroup.add(pillow);

            // Toallas dobladas / enrolladas encima
            const topY = frameH + mattressH + (hasWhiteTopSheet ? 0.015 : 0.005);
            if (towelType === 'double') {
                // Dos rollos de toalla blancos (Cama 1)
                [-0.085, 0.085].forEach(offsetX => {
                    const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.26, 14), whiteClothMat);
                    roll.rotation.z = Math.PI / 2;
                    roll.position.set(offsetX, topY + 0.05, 0.18);
                    roll.castShadow = true;
                    bedGroup.add(roll);
                });
            } else if (towelType === 'single') {
                // Un rollo de toalla blanco (Cama 2)
                const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.25, 14), whiteClothMat);
                roll.rotation.z = Math.PI / 2;
                roll.position.set(0, topY + 0.048, 0.15);
                roll.castShadow = true;
                bedGroup.add(roll);
            } else if (towelType === 'folded_amenities') {

                [-0.19, -0.18, -0.04, -0.04],

                [-0.19, 0.18, -0.04, 0.04],

            ];
            legOffsets.forEach(([lx, lz, tiltX, tiltZ]) => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.015, 0.45, 10), plasticMat);
                leg.position.set(lx, 0.22, lz);
                leg.rotation.z = -tiltX;

                new THREE.MeshStandardMaterial({

                    roughness: 0.35,

            backrest.position.set(0, 0.63, 0.02);
            backrest.castShadow = true;
            chairGroup.add(backrest);

            // Apoyabrazos laterales

                const armFront = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.17, 8), plasticMat);
                armFront.position.set(ax, 0.525, 0.13);

            return chairGroup;
        }

        function buildDiningAndFan() {

            const tableH = 0.73;

            const tableTop = new THREE.Mesh(new THREE.BoxGeometry(tableW, 0.045, tableL), plasticMat);
            tableTop.position.y = tableH;
            tableTop.castShadow = true;
            tableTop.receiveShadow = true;
            tableGroup.add(tableTop);

            // Falda inferior de la mesa
            const apron = new THREE.Mesh(new THREE.BoxGeometry(tableW - 0.08, 0.06, tableL - 0.08), plasticMat);
            apron.position.y = tableH - 0.045;
            tableGroup.add(apron);

            // Patas de la mesa + cruceta inferior
            const tLegPositions = [
                [-tableW / 2 + 0.06, -tableL / 2 + 0.06],
                [tableW / 2 - 0.06, -tableL / 2 + 0.06],

                leg.position.set(x, tableH / 2, z);
                leg.castShadow = true;
                tableGroup.add(leg);

            // Cruceta de refuerzo en las patas
            const brace1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 1.35), plasticMat);
            brace1.position.y = 0.24;
            brace1.rotation.y = 0.58;
            tableGroup.add(brace1);

            const brace2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 1.35), plasticMat);
            brace2.position.y = 0.24;
            brace2.rotation.y = -0.58;

            // Dos controles remotos sobre la mesa (TV y Aire Acondicionado, Foto 2)

            // Ventilador de pedestal blanco junto al extremo cercano de la mesa (Foto 2)

            // Tubo inferior y tubo cromado extensible

                color: 0xdbe4ee,

        }

        // ==========================================
        // INTERACTIVIDAD Y CONTROLES DE USUARIO
        // ==========================================
        function setupUIEvents() {
            // Botones de presets de cámara
            const presetButtons = document.querySelectorAll('.preset-btn');
            presetButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const presetKey = btn.getAttribute('data-preset');
                    const preset = CAMERA_PRESETS[presetKey];
                    if (!preset) return;

                    presetButtons.forEach(b => b.classList.remove('btn-active'));
                    btn.classList.add('btn-active');

                    cameraAnim.startPos.copy(camera.position);
                    cameraAnim.endPos.copy(preset.pos);
                    cameraAnim.startTarget.copy(controls.target);
                    cameraAnim.endTarget.copy(preset.target);
                    cameraAnim.progress = 0;
                    cameraAnim.active = true;
                });
            });

            // Botón alternar iluminación Día / Noche
            const btnLighting = document.getElementById('btn-lighting');
            const lightingText = document.getElementById('lighting-text');
            const lightingIcon = document.getElementById('lighting-icon');

            btnLighting.addEventListener('click', () => {
                isNightMode = !isNightMode;
                if (isNightMode) {
                    lightingIcon.textContent = '🌙';
                    lightingText.textContent = 'Luz: Noche';
                    ambientLight.intensity = 0.24;
                    hemiLight.intensity = 0.22;
                    dirLight.intensity = 0.12;
                    sconceLight1.intensity = 1.35;
                    sconceLight2.intensity = 1.35;
                    sconceBulbMat1.emissiveIntensity = 2.0;
                    sconceBulbMat2.emissiveIntensity = 2.0;
                    tvScreenMat.emissiveIntensity = 0.65;
                } else {
                    lightingIcon.textContent = '☀️';
                    lightingText.textContent = 'Luz: Día Cálida';
                    ambientLight.intensity = 0.72;
                    hemiLight.intensity = 0.62;
                    dirLight.intensity = 0.45;
                    sconceLight1.intensity = 0.42;
                    sconceLight2.intensity = 0.42;
                    sconceBulbMat1.emissiveIntensity = 0.9;
                    sconceBulbMat2.emissiveIntensity = 0.9;
                    tvScreenMat.emissiveIntensity = 0.25;
                }
            });

            // Selector de tono de pared (presets + selector libre)
            const swatches = document.querySelectorAll('.wall-swatch');
            const colorPicker = document.getElementById('wall-color-picker');

            function updateWallHex(hexColor) {
                if (!creamWallMat) return;
                creamWallMat.color.set(hexColor);
                if (beamMat) {
                    const c = new THREE.Color(hexColor);
                    c.offsetHSL(0, 0, -0.02);
                    beamMat.color.copy(c);
                }
            }

            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    const hex = swatch.getAttribute('data-wall');
                    updateWallHex(hex);
                    colorPicker.value = hex;
                    swatches.forEach(s => {
                        s.classList.remove('border-2', 'border-amber-400');
                        s.classList.add('border', 'border-white/40');
                    });
                    swatch.classList.remove('border', 'border-white/40');
                    swatch.classList.add('border-2', 'border-amber-400');
                });
            });

            colorPicker.addEventListener('input', (e) => {
                updateWallHex(e.target.value);
                swatches.forEach(s => {
                    s.classList.remove('border-2', 'border-amber-400');
                    s.classList.add('border', 'border-white/40');
                });
            });

            // Botón alternar visibilidad del techo
            const btnRoof = document.getElementById('btn-roof');
            const roofText = document.getElementById('roof-text');
            btnRoof.addEventListener('click', () => {
                isRoofVisible = !isRoofVisible;
                if (roofGroup) {
                    roofGroup.visible = isRoofVisible;
                }
                roofText.textContent = isRoofVisible ? 'Ocultar Techo' : 'Mostrar Techo';
            });
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Aspas giratorias internas
            if (fanBladesGroup) {
                fanBladesGroup.rotation.x += 0.14;
            }

            // Movimiento opcional con teclado (WASD o Flechas)
            const moveSpeed = 0.045;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();

            if (keysPressed['KeyW'] || keysPressed['ArrowUp']) {
                camera.position.addScaledVector(forward, moveSpeed);
                controls.target.addScaledVector(forward, moveSpeed);
            }
            if (keysPressed['KeyS'] || keysPressed['ArrowDown']) {
                camera.position.addScaledVector(forward, -moveSpeed);
                controls.target.addScaledVector(forward, -moveSpeed);
            }
            if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) {
                camera.position.addScaledVector(right, -moveSpeed);
                controls.target.addScaledVector(right, -moveSpeed);
            }
            if (keysPressed['KeyD'] || keysPressed['ArrowRight']) {
                camera.position.addScaledVector(right, moveSpeed);
                controls.target.addScaledVector(right, moveSpeed);
            }

            // Interpolación suave de transición de cámara
            if (cameraAnim.active) {
                cameraAnim.progress += 0.032;
                const t = Math.min(cameraAnim.progress, 1);
                // Curva easeInOutCubic
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

                camera.position.lerpVectors(cameraAnim.startPos, cameraAnim.endPos, ease);
                controls.target.lerpVectors(cameraAnim.startTarget, cameraAnim.endTarget, ease);

                if (t >= 1) {
                    cameraAnim.active = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            init();
            animate();
        };
    </script>
